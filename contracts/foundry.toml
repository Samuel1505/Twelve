[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
# VERIFY (Phase 0 step 4): highest evm_version accepted on Arc (Osaka baseline). prague is the fallback.
evm_version = "prague"
optimizer = true
optimizer_runs = 200

[profile.arc]
test = "test-arc"

[rpc_endpoints]
arc = "${ARC_RPC_URL}"
arc_testnet = "${ARC_TESTNET_RPC_URL}"
