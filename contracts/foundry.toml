[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# script/DeployCorpusDeployed.s.sol deploys corpus cases c09–c11 for deployed-mode tests
allow_paths = ["../corpus"]
include_paths = [".."]
solc_version = "0.8.30"
# Phase 0: osaka accepted on Arc testnet (ARC_LEDGER §4).
evm_version = "osaka"
optimizer = true
optimizer_runs = 200

[profile.arc]
test = "test-arc"

[rpc_endpoints]
arc = "${ARC_RPC_URL}"
arc_testnet = "${ARC_TESTNET_RPC_URL}"
