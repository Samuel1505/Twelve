[project]
name = "twelve"
version = "0.1.0"
description = "Arc decimal-unit dataflow analyzer (USDC 6-dec vs 18-dec views)"
requires-python = "==3.12.*"
dependencies = [
    "slither-analyzer==0.11.6",
    "crytic-compile==0.4.2",
]

[project.scripts]
twelve = "twelve.cli:main"

[dependency-groups]
dev = ["pytest", "mypy", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twelve"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
