[project]
name = "twelve"
version = "0.1.0"
description = "Arc decimal-unit dataflow analyzer (USDC 6-dec vs 18-dec views)"
requires-python = "==3.12.*"
dependencies = [
    "slither-analyzer==0.11.6",
    "crytic-compile==0.4.2",
    "rfc8785==0.1.4",
    "pycryptodome==3.23.0",
]

[project.scripts]
twelve = "twelve.cli:main"

[dependency-groups]
dev = ["pytest", "mypy", "ruff", "hypothesis==6.168.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twelve"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
# Slither ships no py.typed marker; its objects are Any at our boundary (see SLITHIR_NOTES.md).
module = ["slither.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
