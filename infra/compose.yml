# Local Postgres for api + monitor. DATABASE_URL=postgres://twelve:twelve@localhost:5432/twelve
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: twelve
      POSTGRES_PASSWORD: twelve
      POSTGRES_DB: twelve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twelve"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
